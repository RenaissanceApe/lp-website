# Deploys the form front door (_intake/) to Cloudflare Workers.
# Never touches DNS, the site, or GitHub Pages. How and when: _docs/FORM_FRONT_DOOR.md.
#
# Runs when:
#   - the owner adds the label "deploy-intake" to a pull request (the first deploy,
#     before the form change merges: a manual run is only possible once this file
#     is on main);
#   - the owner runs it by hand (Actions → intake-deploy → Run workflow);
#   - a change under _intake/ lands on main.
# Without the Cloudflare secrets it tests the Worker and skips the deploy, green.
name: intake-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['_intake/**']
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: intake-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.label.name == 'deploy-intake'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INTAKE_D1_ID: ${{ secrets.INTAKE_D1_ID }}
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the Worker
        run: node --test --disable-warning=ExperimentalWarning '_intake/test/*.test.mjs'

      - name: Skip when the secrets are not set
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' || env.INTAKE_D1_ID == ''
        run: echo "::notice::Cloudflare secrets not set; deploy skipped. See _docs/FORM_FRONT_DOOR.md."

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' && env.INTAKE_D1_ID != ''
        run: node _intake/deploy.mjs
